<!DOCTYPE html>

    <link rel="stylesheet" href="./styles/style.css">
</head>

<body class="font-inter">
    <nav class="navbar">
        <div class="logo1">
            <h3>Smart<span class="gradient-color">Deals</span></h3>
        </div>
        <ul>
            <li><a href="./index.html">Home</a></li>
            <li><a href="all-product.html">All Product</a></li>
            <li><a href="#">My Product</a></li>
            <li><a href="#">My Bids</a></li>
            <li><a href="#">Create Product</a></li>
        </ul>
        <div>
            <div class="nav-button">
                <button class="btn unfill-button view-effect"><a href="login.html">Login</a></a></button>
                <button class="btn fill-button button-hover-effect"><a id="color-white" href="regester.html">Regester</a></button>
            </div>
        </div>
    </nav>



    <section class="main">
        <div class="login-container">
            <h3>Regester Now!</h3>
            <p>Already have an account? <a href="login.html" class="reg">Login Now</a></p>
            <form action="#">
                <label for="text" class="label-names">Name</label>
                <input type="text" name="text" id="text" placeholder="sayedhasandipto@gmail.com">
                <label for="email" class="label-names">Email</label>
                <input type="email" name="email" id="email" placeholder="sayedhasandipto@gmail.com">
                <label for="uplode" class="label-names">Img-URL</label>
                <input type="url" name="uplode" id="uplode" placeholder="Uplode Img" class="label-names">
                <label for="password" class="label-names">Password</label>
                <input type="password" name="password" id="password" placeholder="Password">
                <input type="submit" value="Sign In" class="fill-button">
                <label for="or">OR</label>
                <input type="submit" value="Sign In With Google" class="box-shadow">
            </form>
        </div>
    </section>



</body>
